# Offline-start override for media-button.service.
#
# Why this is a drop-in and not an edit to the unit itself: install.sh rewrites the
# hardcoded UID in media-button.service per device, so the repo's unit is deliberately
# never copied over an installed one (see sync-system-files.sh). A drop-in retrofits
# every existing device without touching that UID fix — sync-system-files.sh installs
# this file to /etc/systemd/system/media-button.service.d/ on each start.
#
# What it changes:
#  - drops the network-online wait, so a unit with no connection (e.g. moved to another
#    site on a different SSID) still comes straight up on its downloaded videos;
#  - makes the git/pip auto-update steps optional ("-"), so a failed update offline no
#    longer aborts the whole service before the app launches.
# The "+sync-system-files.sh" step is kept (it runs as root to sync /etc and reclaim
# the .data dir) and the step ORDER is preserved. New calls are unaffected.
[Unit]
Wants=
After=

[Service]
ExecStartPre=
ExecStartPre=-/usr/bin/git -C /opt/media-button fetch --all
ExecStartPre=-/usr/bin/git -C /opt/media-button reset --hard origin/main
ExecStartPre=+/opt/media-button/publish/pi/sync-system-files.sh
ExecStartPre=-/opt/media-button/.venv/bin/pip install -q -r /opt/media-button/publish/pi/requirements.txt
