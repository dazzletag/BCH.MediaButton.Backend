beacons:
  "eddystone:e5a4a7e5a48f3132333444584c29191a":
    resident: "Jane Smith"

  "ibeacon:fda50693-a4e2-4fb1-afcf-c6eb07647825-10011-19641":
    resident: "Nicolas Belcher"

  "ibeacon:fda50693-a4e2-4fb1-afcf-c6eb0764xxxx-10011-19641":
    resident: "Robbie Freeman"

residents:
  "Jane Smith":
    mode: "music"
    query: "Elvis Presley greatest hits"

  "John Doe":
    mode: "radio"
    url: "https://stream.live.vc.bbcmedia.co.uk/bbc_radio_two"

detection_cooldown: 0.3

# How long the beacon may go unheard before playback stops, in seconds.
#
# This is the one that governs it. A beacon advertises roughly once a second,
# but adverts get missed, and a gap longer than this is treated as the switch
# having been put down. Set too tight, a resident's video stops in the middle
# while they are still holding it.
#
# Measured on Jules Challen's beacon on 2026-10-15: mean gap 1.2s, but a fifth
# of adverts more than 2s apart and several over 5s in a single sitting. At the
# old default of 5 her videos stopped roughly every forty seconds. Twelve gives
# real headroom while still stopping within about twelve seconds of the switch
# genuinely going down.
#
# If a device stops mid-video, read the [PRESENCE] lines in the log before
# changing this: they report the real gaps, and a beacon whose worst gap is
# growing usually wants a new battery rather than a longer timeout.
absence_timeout: 12

# Read, but nothing uses them. Kept only because existing devices have them in
# their config and removing them would look like a setting had been taken away.
# The startup log says so too, so nobody tunes these expecting an effect.
gone_timeout: 1
stop_grace_misses: 1
watchdog_interval: 0.2

# Control mode:
# - "beacon" (default): start/stop via beacons as today.
# - "remote_menu": skip beacon triggers; show a TV-remote-driven menu (FLIRC/USB) to pick items.
control_mode: beacon
remote_control:
  resident: "Jane Smith"          # which resident's playlist to use in remote menu mode
  show_menu_on_start: true        # show menu immediately on boot when in remote_menu mode
  keymap:                         # override if your remote sends different keys (Tk key symbols)
    menu: "m"
    up: "Up"
    down: "Down"
    select: "Return"
    back: "Escape"
    pause: "space"
  radio_stations:                 # shown as a Radio submenu in remote_menu mode
    - name: "BBC Radio 3"
      url: "radio:https://lsn.lv/bbcradio.m3u8?station=bbc_radio_three&bitrate=128000"
    - name: "BBC Radio Bristol"
      url: "radio:https://lsn.lv/bbcradio.m3u8?station=bbc_radio_bristol&bitrate=128000"
