<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-labelledby="title desc">
  <title id="title">Press &amp; Play Media Button</title>
  <desc id="desc">Play button mark with Press &amp; Play Media Button wordmark.</desc>
  <defs>
    <linearGradient id="pp-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#19a2a8" />
      <stop offset="100%" stop-color="#0b6f93" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1d2b38" flood-opacity="0.25" />
    </filter>
  </defs>
  <g fill="none" fill-rule="evenodd" transform="translate(12 12)">
    <g filter="url(#shadow)">
      <circle cx="88" cy="98" r="78" fill="url(#pp-grad)" />
      <polygon points="72 60 132 98 72 136" fill="#ffffff" />
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0c778f">
      <text font-size="42" x="180" y="90">Press</text>
      <text font-size="42" x="180" y="132">&amp; Play</text>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="22" letter-spacing="2.8" fill="#545861">
      <text x="180" y="166">MEDIA BUTTON</text>
    </g>
  </g>
</svg>
