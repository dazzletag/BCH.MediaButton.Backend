<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 48" role="img" aria-labelledby="title desc">
  <title id="title">Press &amp; Play</title>
  <desc id="desc">Play-forward mark for Press &amp; Play Media Button.</desc>
  <g fill="none" fill-rule="evenodd">
    <circle cx="24" cy="24" r="18" fill="url(#grad-teal)" />
    <path fill="#FFFFFF" d="M18 14v20l16-10z" />
    <circle cx="66" cy="24" r="18" fill="#4B2F58" />
    <text x="57" y="30" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16">&amp;</text>
    <g fill="#2f2932" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18">
      <text x="92" y="22">Press</text>
      <text x="92" y="40">Play</text>
    </g>
  </g>
  <defs>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D8AB2" />
      <stop offset="100%" stop-color="#0B6F93" />
    </linearGradient>
  </defs>
</svg>
