<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Press &amp; Play</title>
  <desc id="desc">Stacked wordmark for Press &amp; Play Media Button.</desc>
  <g fill="none" fill-rule="evenodd">
    <g fill="#0D8AB2" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30">
      <text x="12" y="44">Press</text>
      <text x="12" y="78">&amp; Play</text>
    </g>
    <g fill="#5A5D63" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="16" letter-spacing="2">
      <text x="12" y="110">MEDIA</text>
      <text x="12" y="130">BUTTON</text>
    </g>
  </g>
</svg>
